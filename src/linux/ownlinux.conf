# Boots our own Linux in place of Amazon's userspace when
# /mnt/us/linux/BOOT_OWN exists. While this task runs, dbus stays at
# "starting", so nothing above it (lab126, X, the Java UI) ever starts.
# When our system exits, the task ends and the stock Kindle boots as normal.
# Installed as /etc/upstart/ownlinux.conf. Delete that file to remove the hook.

start on starting dbus

task

script
  [ -f /mnt/base-us/linux/BOOT_OWN ] || exit 0
  sh /mnt/base-us/linux/boot.sh || true
end script
